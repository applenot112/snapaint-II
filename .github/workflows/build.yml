name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android project
        run: |
          npm init -y
          npm pkg set name=snapaint
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "SnapPaint" com.example.snapaint --web-dir=www
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: snapaint-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

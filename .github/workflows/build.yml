name: build-apk-fixed
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & Init Capacitor
        run: |
          # 初始化 package.json (若不存在)
          if [ ! -f package.json ]; then
            npm init -y
          fi
          
          # 安裝 Capacitor 核心與 Android 平台
          npm install @capacitor/core @capacitor/android --save-exact
          npm install -D @capacitor/cli --save-exact
          
          # 強制非互動式初始化 Capacitor 設定
          # 注意：這裡假設 www/index.html 已經存在
          npx cap init "SnapPaint" com.example.snapaint --web-dir=www --force

      - name: Add Android Platform
        run: |
          # 移除可能存在的舊 android 目錄以避免衝突
          rm -rf android || true
          npx cap add android

      - name: Inject Permissions into Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 使用 sed 插入相機與媒體權限
          # 確保在 <application> 標籤前插入
          sed -i '/<application/a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          sed -i '/<application/a\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' "$MANIFEST"
          sed -i '/<application/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"

      - name: Sync and Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          # 執行 Debug 構建
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapaint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build SnapPaint APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 取得原始碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設置 Node.js (使用最新 LTS 版本 22)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. 安裝 Capacitor 依賴項
      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      # 4. 初始化 Capacitor 項目 (這會創建 capacitor.config.ts)
      - name: Init Capacitor Config
        run: |
          npx cap init "SnapPaint" com.example.snapaint --web-dir=www --force

      # 5. 添加 Android 平台 (這會創建 android/ 資料夾及其中的所有 Gradle 檔案)
      # 【關鍵】這一步必須在 setup-java 之前完成，否則 Java 插件找不到 Gradle 檔案
      - name: Add Android Platform
        run: npx cap add android

      # 6. 設置 Java JDK (使用 v5 版本以消除棄用警告)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 7. 注入權限到 AndroidManifest.xml
      - name: Inject Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application>/a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          sed -i '/<application>/a\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' "$MANIFEST"

      # 8. 同步 Web 資源到 Android 項目
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. 編譯 APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. 上傳成品
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapaint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

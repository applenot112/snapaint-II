<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>一拍即玩 SnapPaint</title>
<style>
:root{--bg:#0f1220;--panel:#181c2e;--panel2:#232946;--text:#eef0ff;--sub:#9aa1c0;
  --accent:#6c8bff;--accent2:#9a6bff;--ok:#38d39f;--err:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  overscroll-behavior:none}
.screen{display:none;flex-direction:column;height:100%;max-width:860px;margin:0 auto}
.screen.active{display:flex}
button{font:inherit;color:var(--text);border:0;background:var(--panel2);border-radius:12px;
  padding:10px 14px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
header.top{padding:18px 16px 8px}
.logo{font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--sub);font-size:13px;margin-top:4px}
  .actions{display:flex;gap:10px;padding:12px 16px}
.actions button{flex:1;padding:16px;font-size:16px;font-weight:700;
  background:linear-gradient(135deg,#3b4a8f,#4a3b8f)}
h3.sec{margin:8px 16px;color:var(--sub);font-size:14px;font-weight:600}
.list{flex:1;overflow-y:auto;padding:0 16px 20px}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.card{display:flex;gap:12px;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.card .thumb{width:84px;height:60px;object-fit:cover;border-radius:8px;background:#333}
.card .meta{flex:1;min-width:0}
.card .meta b{display:block;font-size:14px}
.card .meta small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.card .btns{display:flex;gap:6px}
.card .go{background:var(--accent);color:#fff;font-weight:700}
.card .del{background:#3a2030}

  .setup-top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.setup-top .icon{font-size:22px}
#prevWrap{padding:8px 16px;text-align:center}
#prev{max-width:100%;max-height:230px;border-radius:12px;background:#000}
.tiers{padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.tier{display:flex;justify-content:space-between;align-items:center;padding:16px;
  background:var(--panel);border:1px solid #2c3357}
.tier .t1{font-weight:800;font-size:16px}
.tier .t2{color:var(--sub);font-size:13px}
.note{color:var(--sub);font-size:12px;padding:6px 20px 20px;line-height:1.7}
.gtop{display:flex;align-items:center;gap:8px;padding:10px 12px}
.icon{min-width:40px;height:40px;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.gtitle{flex:1;min-width:0;display:flex;flex-direction:column}
.gtitle b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle span{font-size:11px;color:var(--sub)}
#progBarWrap{height:4px;background:#222741;margin:0 12px 6px;border-radius:2px;overflow:hidden}
#progBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#10131f}
#board{position:absolute;inset:0;touch-action:none;-webkit-touch-callout:none;user-select:none}
  .selbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel)}
.selsw{width:40px;height:40px;border-radius:10px;background:#3a3f52;border:2px solid #454b6b;flex:none}
.selcd{font-family:ui-monospace,monospace;font-weight:800;font-size:16px;min-width:64px}
.selbar input{flex:1;min-width:0;background:#0d1020;border:1px solid #333a5e;color:var(--text);
  border-radius:10px;padding:9px 10px;font-family:ui-monospace,monospace;text-transform:uppercase;font-size:15px}
#codeGo{background:var(--accent);color:#fff;font-weight:700}
#palette{display:flex;gap:8px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--panel);overscroll-behavior:contain}
.chip{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:#0d1020;border:2px solid transparent;border-radius:12px;padding:6px 2px}
.chip .sw{width:38px;height:38px;border-radius:9px;background:var(--c);border:1px solid rgba(255,255,255,.15)}
.chip .cd{font-family:ui-monospace,monospace;font-size:11px;color:#cfd4ea}
.chip .ct{font-size:10px;color:var(--sub)}
.chip.sel{border-color:var(--accent);background:#1b2350}
.chip.done{opacity:.35;filter:grayscale(.6)}
.ov{position:fixed;inset:0;background:rgba(5,7,15,.8);display:none;align-items:center;
  justify-content:center;z-index:50;padding:24px}
.ov.show{display:flex}
.ovcard{background:var(--panel);border-radius:18px;padding:22px;max-width:420px;width:100%;
  text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.ovcard h2{margin:0}
#winCv{max-width:100%;border-radius:10px;image-rendering:pixelated}
.ovcard .row{display:flex;gap:10px;width:100%}
.ovcard .row button{flex:1}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:700}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
  background:#2b3153;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<body>
<div id="scr-home" class="screen active">
  <header class="top">
    <div class="logo">🎨 一拍即玩</div>
    <div class="sub">拍下照片，選擇解析度，以 12-bit RGB 顏色編碼逐格填色，重現原圖。</div>
  </header>
  <div class="actions">
    <button id="btnCam">📷 即影即玩</button>
    <button id="btnLib">🖼️ 從相簿選擇</button>
  </div>
  <h3 class="sec">我的作品</h3>
  <div id="projList" class="list"></div>
</div>
<div id="scr-setup" class="screen">
  <div class="setup-top">
    <button id="btnSetupBack" class="icon">‹</button>
    <b>選擇遊玩解析度</b>
  </div>
  <div id="prevWrap"><canvas id="prev"></canvas></div>
  <div id="tiers" class="tiers"></div>
  <div class="note">
    解析度越高、格數越多、越考眼力。照片會由 16,777,216 色濃縮至最多 4,096 色（12-bit RGB）。
    每一格以 3 位十六進位編碼表示目標顏色（例如 <b>F80</b>），雙指可放大縮小，選取對應編碼後方可填色。
  </div>
</div>
<div id="scr-game" class="screen">
  <div class="gtop">
    <button id="btnBack" class="icon">‹</button>
    <div class="gtitle"><b id="gName"></b><span id="progTxt"></span></div>
    <button id="btnMode" class="icon" title="填色／移動切換">🖌</button>
    <button id="btnHint" class="icon" title="提示">💡</button>
    <button id="btnReset" class="icon" title="重新開始">↺</button>
  </div>
  <div id="progBarWrap"><div id="progBar"></div></div>
  <div id="stage"><canvas id="board"></canvas></div>
  <div class="selbar">
    <div class="selsw" id="selSw"></div>
    <div class="selcd" id="selCd">——</div>
    <input id="codeIn" maxlength="3" placeholder="輸入編碼" autocomplete="off" enterkeyhint="done">
    <button id="codeGo">選擇</button>
  </div>
  <div id="palette"></div>
</div>
<div id="busyOv" class="ov"><div class="ovcard">⏳ 正在生成拼圖…</div></div>
<div id="winOv" class="ov">
  <div class="ovcard">
    <h2>🎉 完成！</h2>
    <canvas id="winCv"></canvas>
    <div id="winStat" class="sub"></div>
    <div class="row">
      <button id="btnWinAgain">再玩一次</button>
      <button id="btnWinHome" class="primary">返回主頁</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="inpCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inpLib" accept="image/*" hidden>
<script>
'use strict';
const TIERS={
  '360p' :{w:64, h:36, label:'360p 輕鬆模式'},
  '720p' :{w:128,h:72, label:'720p 標準模式'},
  '1080p':{w:192,h:108,label:'1080p 挑戰模式'}
};
const COLOR_CSS=new Array(4096),COLOR_HEX=new Array(4096),COLOR_RGB=new Array(4096);
for(let i=0;i<4096;i++){
  const r=((i>>8)&15)*17,g=((i>>4)&15)*17,b=(i&15)*17;
  COLOR_CSS[i]='rgb('+r+','+g+','+b+')';
  COLOR_HEX[i]=i.toString(16).toUpperCase().padStart(3,'0');
  COLOR_RGB[i]=[r,g,b];
}
const HSL=(()=>{const a=new Array(4096);
  for(let i=0;i<4096;i++){
    const r=COLOR_RGB[i][0]/255,g=COLOR_RGB[i][1]/255,b=COLOR_RGB[i][2]/255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
    let h=0;const s=d===0?0:d/(1-Math.abs(2*l-1));
    if(d!==0){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
    a[i]={h:h,s:s,l:l};
  } return a;})();
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function b64(u8){let s='';for(let k=0;k<u8.length;k+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(k,k+0x8000));return btoa(s);}
function unb64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function fmt(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?h+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'):m+':'+String(ss).padStart(2,'0');}
let toastTimer=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));}
const idb={db:null,
  open(){return new Promise((res,rej)=>{ if(this.db)return res(this.db);
    const q=indexedDB.open('snapaint',1);
    q.onupgradeneeded=()=>q.result.createObjectStore('projects',{keyPath:'id'});
    q.onsuccess=()=>{this.db=q.result;res(this.db);};
    q.onerror=()=>rej(q.error);});},
  async put(rec){const db=await this.open();return new Promise((res,rej)=>{
    const t=db.transaction('projects','readwrite');t.objectStore('projects').put(rec);
    t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async get(id){const db=await this.open();return new Promise((res,rej)=>{
    const rq=db.transaction('projects').objectStore('projects').get(id);
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});},
  async all(){const db=await this.open();return new Promise((res,rej)=>{
    const rq=db.transaction('projects').objectStore('projects').getAll();
    rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);});},
  async del(id){const db=await this.open();return new Promise((res,rej)=>{
    const t=db.transaction('projects','readwrite');t.objectStore('projects').delete(id);
    t.oncomplete=res;t.onerror=()=>rej(t.error);});}
};
let P=null;
let view={s:10,x:0,y:0};
let minS=1,selected=-1,mode='paint';
let sessionStart=0,saveTimer=null;
let flashes=[];
let chipEls=new Array(4096).fill(null);
let setupImg=null;
  $('btnCam').onclick=()=>$('inpCam').click();
$('btnLib').onclick=()=>$('inpLib').click();
$('inpCam').onchange=e=>loadFile(e);
$('inpLib').onchange=e=>loadFile(e);
function loadFile(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);toSetup(img);};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('無法開啟此圖片');};
  img.src=url;
}
function toSetup(img){
  setupImg=img;show('scr-setup');
  const prev=$('prev'),maxW=Math.min(innerWidth-48,560),maxH=230;
  const sc=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight,1);
  prev.width=Math.round(img.naturalWidth*sc);prev.height=Math.round(img.naturalHeight*sc);
  prev.getContext('2d').drawImage(img,0,0,prev.width,prev.height);
  const box=$('tiers');box.innerHTML='';
  ['360p','720p','1080p'].forEach(key=>{
    const t=TIERS[key],d=gridDims(key,img.naturalWidth,img.naturalHeight);
    const b=document.createElement('button');b.className='tier';
    b.innerHTML='<div class="t1">'+t.label+'</div><div class="t2">'+d.cols+' × '+d.rows+' · '+(d.cols*d.rows).toLocaleString()+' 格</div>';
    b.onclick=()=>beginGame(key);
    box.appendChild(b);
  });
}
$('btnSetupBack').onclick=()=>show('scr-home');
function gridDims(tier,aw,ah){
  const t=TIERS[tier],asp=aw/ah;let cols,rows;
  if(asp>=t.w/t.h){cols=t.w;rows=Math.max(1,Math.round(t.w/asp));}
  else
    function enterGame(p){
  P=p;sessionStart=Date.now();
  P.cnt=new Uint32Array(4096);P.fil=new Uint32Array(4096);
  for(let i=0;i<P.codes.length;i++){P.cnt[P.codes[i]]++;if(P.filled[i])P.fil[P.codes[i]]++;}
  P.total=P.cols*P.rows;P.done=0;
  for(let k=0;k<4096;k++)P.done+=P.fil[k];
  P.palette=[];
  for(let k=0;k<4096;k++)if(P.cnt[k])P.palette.push({idx:k,count:P.cnt[k]});
  P.palette.sort((A,B)=>{
    const a=HSL[A.idx],b=HSL[B.idx];
    const ga=a.s<.12?1:0,gb=b.s<.12?1:0;
    if(ga!==gb)return ga-gb;
    if(ga)return a.l-b.l;
    const ba=Math.floor(a.h/24)%15,bb=Math.floor(b.h/24)%15;
    if(ba!==bb)return ba-bb;
    return (a.l-b.l)||(B.count-A.count);
  });
  selected=-1;$('selSw').style.background='#3a3f52';$('selCd').textContent='——';
  $('codeIn').value='';
  buildPaletteDOM();
  $('gName').textContent=P.name+'（'+P.tier+'）';
  mode='paint';setModeUI();
  show('scr-game');
  requestAnimationFrame(()=>{resizeCanvas();fitView();requestDraw();});
  updateProgressUI();
  if(!localStorage.getItem('sp_hint')){
    localStorage.setItem('sp_hint','1');
    toast('雙指縮放移動 · 單指填色 · 放大可見到每格編碼');
  }
}
function buildPaletteDOM(){
  const box=$('palette');box.innerHTML='';chipEls=new Array(4096).fill(null);
  const frag=document.createDocumentFragment();
  for(const e of P.palette){
    const c=document.createElement('button');c.className='chip';
    c.style.setProperty('--c',COLOR_CSS[e.idx]);
    c.innerHTML='<span class="sw"></span><span class="cd">'+COLOR_HEX[e.idx]+
                '</span><span class="ct">'+(e.count-P.fil[e.idx])+'</span>';
    c.onclick=()=>selectColor(e.idx);
    chipEls[e.idx]=c;frag.appendChild(c);
  }
  box.appendChild(frag);
}
function selectColor(idx){
  selected=idx;
  for(const e of P.palette){const el=chipEls[e.idx];if(el)el.classList.remove('sel');}
  const el=chipEls[idx];
  if(el){el.classList.add('sel');el.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}
  $('selSw').style.background=COLOR_CSS[idx];
  $('selCd').textContent='#'+COLOR_HEX[idx];
}
function updateProgressUI(){
  const pct=P.total?Math.round(P.done/P.total*100):0;
  $('progTxt').textContent='已填 '+P.done.toLocaleString()+' / '+P.total.toLocaleString()+
    ' · '+pct+'% · 用色 '+P.palette.length+' / 4096';
  $('progBar').style.width=pct+'%';
}
$('btnHint').onclick=()=>{
  if(!P)return;
  let target=(selected>=0&&P.cnt[selected]-P.fil[selected]>0)?selected:-1;
  if(target<0){let bn=0;for(const e of P.palette){const r=P.cnt[e.idx]-P.fil[e.idx];if(r>bn){bn=r;target=e.idx;}}}
  if(target<0)return;
  for(let i=0;i<P.codes.length;i++){
    if(!P.filled[i]&&P.codes[i]===target){
      const x=i%P.cols,y=(i/P.cols)|0;
      if(view.s<16)view.s=16;
      view.x=vw/2-(x+0.5)*view.s;view.y=vh/2-(y+0.5)*view.s;
      selectColor(target);
      doFill(i);P.hints++;
      return;
    }
  }
};
$('btnReset').onclick=()=>{
  if(P&&confirm('清除目前進度，重新開始？')){
    P.filled.fill(0);P.fil.fill(0);P.done=0;P.errors=0;P.hints=0;
    selected=-1;$('selSw').style.background='#3a3f52';$('selCd').textContent='——';
    for(const e of P.palette){const el=chipEls[e.idx];
      if(el){el.querySelector('.ct').textContent=e.count;el.classList.remove('done');}}
    updateProgressUI();requestDraw();scheduleSave();
  }
};
$('btnMode').onclick=()=>{mode=mode==='paint'?'pan':'paint';setModeUI();};
function setModeUI(){$('btnMode').textContent=mode==='paint'?'🖌':'✋';}
function tryPaint(x,y,quiet){
  if(!P||x<0||y<0||x>=P.cols||y>=P.rows)return;
  const i=y*P.cols+x;
  if(P.filled[i])return;
  if(selected<0){if(!quiet)toast('請先於下方選擇顏色編碼');return;}
  if(P.codes[i]===selected){doFill(i);}
  else{
    P.errors++;
    flashes.push({i:i,t:performance.now()});
    requestDraw();
    if(navigator.vibrate)navigator.vibrate(50);
  }
}
function doFill(i){
  P.filled[i]=1;P.fil[P.codes[i]]++;P.done++;
  const idx=P.codes[i],rem=P.cnt[idx]-P.fil[idx];
  const el=chipEls[idx];
  if(el){el.querySelector('.ct').textContent=rem;el.classList.toggle('done',rem===0);}
  updateProgressUI();requestDraw();scheduleSave();
  if(P.done===P.total){setTimeout(win,300);return;}
  if(selected===idx&&rem===0){
    let best=-1,bn=0;
    for(const e of P.palette){const r=P.cnt[e.idx]-P.fil[e.idx];if(r>bn){bn=r;best=e.idx;}}
    if(best>=0){selectColor(best);toast('#'+COLOR_HEX[idx]+' 完成！已選擇 #'+COLOR_HEX[best]);}
  }
}
function paintLine(a,b){
  const r=board.getBoundingClientRect();
  const ax=(a.x-r.left-view.x)/view.s,ay=(a.y-r.top-view.y)/view.s;
  const bx=(b.x-r.left-view.x)/view.s,by=(b.y-r.top-view.y)/view.s;
  const steps=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)));
  for(let k=1;k<=steps;k++){
    const x=Math.floor(ax+(bx-ax)*k/steps),y=Math.floor(ay+(by-ay)*k/steps);
    tryPaint(x,y,true);
  }
}
const board=$('board'),ctx=board.getContext('2d'),stage=$('stage');
let dpr=1,vw=0,vh=0,needDraw=false;
function resizeCanvas(){
  dpr=window.devicePixelRatio||1;
  const r=stage.getBoundingClientRect();vw=r.width;vh=r.height;
  board.width=Math.round(vw*dpr);board.height=Math.round(vh*dpr);
  board.style.width=vw+'px';board.style.height=vh+'px';
  requestDraw();
}
function fitView(){
  if(!P)return;
  const s=Math.min(vw/P.cols,vh/P.rows)*0.96;
  view.s=s;minS=s*0.6;
  view.x=(vw-P.cols*s)/2;view.y=(vh-P.rows*s)/2;
}
function requestDraw(){if(!needDraw){needDraw=true;requestAnimationFrame(()=>{needDraw=false;draw();});}}
function draw(){
  if(!P)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#10131f';ctx.fillRect(0,0,vw,vh);
  const cols=P.cols,rows=P.rows,s=view.s,gap=s>=10?1:0;
  ctx.fillStyle='#2a2f45';ctx.fillRect(view.x-2,view.y-2,cols*s+4,rows*s+4);
  const x0=Math.max(0,Math.floor(-view.x/s)),x1=Math.min(cols-1,Math.ceil((vw-view.x)/s));
  const y0=Math.max(0,Math.floor(-view.y/s)),y1=Math.min(rows-1,Math.ceil((vh-view.y)/s));
  for(let y=y0;y<=y1;y++){
    const py=view.y+y*s;
    for(let x=x0;x<=x1;x++){
      const i=y*cols+x;
      ctx.fillStyle=P.filled[i]?COLOR_CSS[P.codes[i]]:'#d7dae2';
      ctx.fillRect(view.x+x*s,py,s-gap,s-gap);
    }
  }
  if(s>=13){
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='600 '+Math.floor(s*0.34)+'px ui-monospace,monospace';
    for(let y=y0;y<=y1;y++){
      const py=view.y+y*s+s/2+0.5;
      for(let x=x0;x<=x1;x++){
        const i=y*cols+x,hx=COLOR_HEX[P.codes[i]];
        if(!P.filled[i]){ctx.fillStyle='#7c8190';ctx.fillText(hx,view.x+x*s+s/2,py);}
        else if(s>=26){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillText(hx,view.x+x*s+s/2,py);}
      }
    }
  }
  const now=performance.now();flashes=flashes.filter(f=>now-f.t<260);
  ctx.fillStyle='rgba(255,77,90,.55)';
  for(const f of flashes){
    const x=f.i%cols,y=(f.i/cols)|0;
    ctx.fillRect(view.x+x*s,view.y+y*s,s,s);
  }
  if(flashes.length)requestDraw();
}
  const pts=new Map();let pinch=null,lastSingle=null,moved=false;
function zoomAt(px,py,f){
  const ns=Math.min(64,Math.max(minS,view.s*f));f=ns/view.s;
  view.x=px-(px-view.x)*f;view.y=py-(py-view.y)*f;view.s=ns;
}
function cellAt(e){
  const r=board.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left-view.x)/view.s);
  const y=Math.floor((e.clientY-r.top-view.y)/view.s);
  return{x:x,y:y};
}
board.addEventListener('pointerdown',e=>{
  board.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const v=[...pts.values()],a=v[0],b=v[1];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
    lastSingle=null;
  }else if(pts.size===1){
    lastSingle={x:e.clientX,y:e.clientY};moved=false;
    if(mode==='paint'){const c=cellAt(e);tryPaint(c.x,c.y,false);}
  }
});
board.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){
    const v=[...pts.values()],a=v[0],b=v[1];
    const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    view.x+=mx-pinch.mx;view.y+=my-pinch.my;
    const r=board.getBoundingClientRect();
    zoomAt(mx-r.left,my-r.top,d/pinch.d);
    pinch={d:d,mx:mx,my:my};
    requestDraw();
  }else if(pts.size===1&&lastSingle){
    const dx=e.clientX-lastSingle.x,dy=e.clientY-lastSingle.y;
    if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    if(mode==='pan'){view.x+=dx;view.y+=dy;requestDraw();}
    else if(moved)paintLine(lastSingle,{x:e.clientX,y:e.clientY});
    lastSingle={x:e.clientX,y:e.clientY};
  }
});
function pointerEnd(e){
  pts.delete(e.pointerId);
  if(pts.size<2)pinch=null;
  if(pts.size===1){const p=[...pts.values()][0];lastSingle={x:p.x,y:p.y};}
  else lastSingle=null;
}
board.addEventListener('pointerup',pointerEnd);
board.addEventListener('pointercancel',pointerEnd);
board.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=board.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15);
  requestDraw();
},{passive:false});
addEventListener('resize',()=>{resizeCanvas();requestDraw();});
$('codeIn').addEventListener('input',function(){this.value=this.value.replace(/[^0-9a-fA-F]/g,'').slice(0,3);});
function applyCode(){
  const v=$('codeIn').value.trim().toUpperCase();
  if(v.length!==3)return toast('請輸入 3 位編碼，例如 F80');
  const idx=parseInt(v,16);
  if(isNaN(idx)||idx>4095)return toast('編碼格式不正確');
  if(!P||!P.cnt[idx])return toast('此照片沒有 #'+v+' 編碼');
  selectColor(idx);$('codeIn').blur();
}
$('codeGo').onclick=applyCode;
$('codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')applyCode();});
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveProject,800);}
function renderThumb(){
  const cols=P.cols,rows=P.rows;
  const c=document.createElement('canvas');c.width=cols;c.height=rows;
  const g=c.getContext('2d'),im=g.createImageData(cols,rows),d=im.data;
  for(let i=0,p=0;i<P.codes.length;i++,p+=4){
    if(P.filled[i]){const rgb=COLOR_RGB[P.codes[i]];d[p]=rgb[0];d[p+1]=rgb[1];d[p+2]=rgb[2];}
    else{d[p]=215;d[p+1]=218;d[p+2]=224;}
    d[p+3]=255;
  }
  g.putImageData(im,0,0);
  if(cols<=120)return c.toDataURL('image/png');
  const t=document.createElement('canvas');t.width=120;t.height=Math.round(120*rows/cols);
  const tg=t.getContext('2d');tg.imageSmoothingEnabled=true;tg.drawImage(c,0,0,t.width,t.height);
  return t.toDataURL('image/jpeg',.85);
}
async function saveProject(){
  if(!P)return;
  try{
    await idb.put({
      id:P.id,name:P.name,tier:P.tier,createdAt:P.createdAt,updatedAt:Date.now(),
      cols:P.cols,rows:P.rows,
      codesB64:b64(new Uint8Array(P.codes.buffer)),
      filledB64:b64(P.filled),
      errors:P.errors,hints:P.hints,
      elapsedMs:P.elapsedMs+(sessionStart?Date.now()-sessionStart:0),
      totalCells:P.total,filledCells:P.done,colorsUsed:P.palette.length,
      thumb:renderThumb()
    });
  }catch(err){console.error(err);}
}
async function refreshHome(){
  const recs=(await idb.all()).sort((a,b)=>b.updatedAt-a.updatedAt);
  const el=$('projList');el.innerHTML='';
  if(!recs.length){el.innerHTML='<div class="empty">尚未有作品，拍一張照片開始吧！</div>';return;}
  for(const r of recs){
    const pct=Math.round(r.filledCells/r.totalCells*100);
    const card=document.createElement('div');card.className='card';
    card.innerHTML='<img class="thumb" src="'+r.thumb+'" alt="">'+
      '<div class="meta"><b>'+r.name+'</b>'+
      '<small>'+r.cols+'×'+r.rows+' · '+r.colorsUsed+' 色 · '+pct+'%</small>'+
      '<small>'+new Date(r.updatedAt).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</small></div>'+
      '<div class="btns"><button class="go" data-id="'+r.id+'">繼續</button>'+
      '<button class="del" data-id="'+r.id+'">🗑</button></div>';
    el.appendChild(card);
  }
}
$('projList').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('go'))openProject(b.dataset.id);
  else if(b.classList.contains('del'))deleteProject(b.dataset.id);
});
async function openProject(id){
  const rec=await idb.get(id);
  if(!rec)return toast('找不到此作品');
  const codes=new Uint16Array(unb64(rec.codesB64).buffer);
  P={id:rec.id,name:rec.name,tier:rec.tier,createdAt:rec.createdAt,
     cols:rec.cols,rows:rec.rows,codes:codes,filled:unb64(rec.filledB64),
     errors:rec.errors||0,hints:rec.hints||0,elapsedMs:rec.elapsedMs||0};
  enterGame(P);
}
async function deleteProject(id){
  if(!confirm('確定刪除此作品？'))return;
  await idb.del(id);refreshHome();
}
$('btnBack').onclick=async()=>{await saveProject();P=null;sessionStart=0;show('scr-home');refreshHome();};
function renderFinalCanvas(){
  const cols=P.cols,rows=P.rows;
  const c=document.createElement('canvas');c.width=cols;c.height=rows;
  const g=c.getContext('2d'),im=g.createImageData(cols,rows),d=im.data;
  for(let i=0,p=0;i<P.codes.length;i++,p+=4){
    const rgb=COLOR_RGB[P.codes[i]];d[p]=rgb[0];d[p+1]=rgb[1];d[p+2]=rgb[2];d[p+3]=255;
  }
  g.putImageData(im,0,0);return c;
}
function win(){
  saveProject();
  $('winStat').textContent='時間 '+fmt(P.elapsedMs+Date.now()-sessionStart)+
    ' · 失誤 '+P.errors+' 次 · 提示 '+P.hints+' 次';
  const src=renderFinalCanvas(),cv=$('winCv');
  cv.width=src.width*3;cv.height=src.height*3;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  g.drawImage(src,0,0,cv.width,cv.height);
  $('winOv').classList.add('show');
}
$('btnWinHome').onclick=()=>{$('winOv').classList.remove('show');P=null;sessionStart=0;show('scr-home');refreshHome();};
$('btnWinAgain').onclick=()=>{
  $('winOv').classList.remove('show');
  P.filled.fill(0);P.fil.fill(0);P.done=0;P.errors=0;P.hints=0;sessionStart=Date.now();
  selected=-1;$('selSw').style.background='#3a3f52';$('selCd').textContent='——';
  for(const e of P.palette){const el=chipEls[e.idx];
    if(el){el.querySelector('.ct').textContent=e.count;el.classList.remove('done');}}
  updateProgressUI();fitView();requestDraw();scheduleSave();
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProject();});
addEventListener('pagehide',()=>saveProject());
refreshHome();
</script>
